server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ironfit-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ironfit_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Yadav@9876}}
    driver-class-name: ${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${DB_DIALECT:${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}}

  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:IronFitGymManagementPlatformSuperSecretJWTKey2026RoorkeeUttarakhand247667SecuredKey!}
    expiration-ms: 86400000 # 24 Hours

logging:
  level:
    root: INFO
    com.gymmanagement: DEBUG
