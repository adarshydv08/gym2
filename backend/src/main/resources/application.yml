server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ironfit-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ironfit_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Yadav@9876}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:IronFitGymManagementPlatformSuperSecretJWTKey2026RoorkeeUttarakhand247667SecuredKey!}
    expiration-ms: 86400000 # 24 Hours

logging:
  level:
    root: INFO
    com.gymmanagement: DEBUG
