version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: ironfit_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Yadav@9876
      MYSQL_DATABASE: ironfit_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ironfit_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: ironfit_db
      DB_USERNAME: root
      DB_PASSWORD: Yadav@9876
      JWT_SECRET: IronFitGymManagementPlatformSuperSecretJWTKey2026RoorkeeUttarakhand247667SecuredKey!
    depends_on:
      - mysqldb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: ironfit_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
